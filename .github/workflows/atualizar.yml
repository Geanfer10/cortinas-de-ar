name: Atualizar dados do Monday

on:
  schedule:
    - cron: "0 * * * *"   # a cada 1 hora
  workflow_dispatch:       # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-monday
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar dados do Monday
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: python scripts/atualizar_monday.py

      - name: Salvar se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/historico.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza dados do Monday ($(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M'))"
            git push
          fi
